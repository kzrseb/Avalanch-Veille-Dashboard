[theme]
base = "light"
primaryColor = "#0a6b3b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f7f5"
textColor = "#1a1a1a"
font = "sans serif"

[server]
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
# Affiche la stacktrace complète dans le navigateur au lieu de "Oh no" — diagnostic
showErrorDetails = "full"
